# Blue-Green : la nouvelle version démarre à côté de l'ancienne, sur le service
# taskflow-preview. Le service taskflow (production) ne bascule qu'à la promotion.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: taskflow
  labels:
    app: taskflow
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: taskflow
  template:
    metadata:
      labels:
        app: taskflow
    spec:
      containers:
        - name: taskflow
          image: ghcr.io/9m7fjfpv9k-cyber/taskflow:1.1.0
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
  strategy:
    blueGreen:
      activeService: taskflow
      previewService: taskflow-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
