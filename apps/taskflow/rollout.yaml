# Canary avec test de robustesse automatique.
# Au palier de 25 %, Argo Rollouts lance un test de charge k6 sur les seuls pods
# de la nouvelle version (service taskflow-canary). Test raté = abandon automatique.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: taskflow
  labels:
    app: taskflow
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: taskflow
  template:
    metadata:
      labels:
        app: taskflow
    spec:
      containers:
        - name: taskflow
          image: ghcr.io/9m7fjfpv9k-cyber/taskflow:2.0.0
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
  strategy:
    canary:
      canaryService: taskflow-canary
      steps:
        - setWeight: 25
        - analysis:
            templates:
              - templateName: robustesse-k6
            args:
              - name: cible
                value: http://taskflow-canary
        - setWeight: 50
        - pause:
            duration: 30s
        - setWeight: 75
        - pause:
            duration: 30s
