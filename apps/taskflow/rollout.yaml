# Canary : la nouvelle version reçoit une part croissante du trafic.
# Sans maillage de service, la part de trafic suit la proportion de pods :
# 4 réplicas → 25 % = 1 pod sur 4.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: taskflow
  labels:
    app: taskflow
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: taskflow
  template:
    metadata:
      labels:
        app: taskflow
    spec:
      containers:
        - name: taskflow
          image: ghcr.io/9m7fjfpv9k-cyber/taskflow:1.1.0
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: {}
        - setWeight: 50
        - pause:
            duration: 60s
        - setWeight: 75
        - pause:
            duration: 30s
